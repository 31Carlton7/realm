# Temporary, for fix/windows-installer-server: does an INSTALLED Windows Realm start its server?
#
#   build:   the NSIS installer from the fix and from the commit it sits on (37109ec0, Realm 2.5.0), with
#            the staged server's and win-unpacked's layout (links, files, bytes), and win-unpacked's
#            `realm serve` run twice: as built, then with .pack-stage moved out of the way.
#   install: each of those installers, and the published 2.3.0, 2.4.0 and 2.5.0 ones, installed silently
#            on a runner that never built anything, then `realm serve` + `realm status` from the install,
#            and the installed Realm.exe launched on a scratch home to see whether its server comes up.
#
# Nothing can reach a model: no agent CLI is installed, no credential exists on the runner, and every
# server runs with REALM_ENABLE_FAKE_AGENT=1 on a home of its own under RUNNER_TEMP.
name: Windows installer

on:
  push:
    branches: [ci/windows-installer]
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fix
            ref: fix/windows-installer-server
          - label: base
            ref: 37109ec0c3c32fc101b41730f4212e5f5aa80185
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Hugeicons registry
        shell: bash
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: |
          test -n "$HUGEICONS_TOKEN" || { echo "::error::HUGEICONS_TOKEN is not set"; exit 1; }
          printf '@hugeicons-pro:registry=https://npm.hugeicons.com/\n//npm.hugeicons.com/:_authToken=%s\n' "$HUGEICONS_TOKEN" >> ~/.npmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Package
        run: pnpm --filter @realm/desktop dist:win

      - name: Layout
        shell: pwsh
        run: |
          function Report($label, $dir) {
            $all = @(Get-ChildItem -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue)
            $links = @($all | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
            $files = @($all | Where-Object { -not $_.PSIsContainer -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) })
            "{0}: {1} links, {2} files, {3:N1} MB" -f $label, $links.Count, $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
            $links | Select-Object -First 3 | ForEach-Object { "  {0} -> {1}" -f $_.FullName.Substring($dir.Length), $_.LinkTarget }
          }
          & {
            Report "staged server (.pack-stage\server)" "$PWD\apps\desktop\.pack-stage\server"
            Report "win-unpacked\resources\server" "$PWD\apps\desktop\release\win-unpacked\resources\server"
            Get-ChildItem apps\desktop\release\*.exe | ForEach-Object { "installer: {0}, {1:N0} bytes" -f $_.Name, $_.Length }
          } | Tee-Object -FilePath "$env:RUNNER_TEMP\layout.txt"
          Get-Content "$env:RUNNER_TEMP\layout.txt" | ForEach-Object { "    $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # win-unpacked on the machine that built it, then with the build tree's .pack-stage moved away: a
      # junction in it that points back into .pack-stage only resolves while that is there.
      - name: win-unpacked's realm serve, with and without .pack-stage
        shell: bash
        env:
          REALM_ENABLE_FAKE_AGENT: "1"
          REALM_PORT: "8795"
        run: |
          set +e -uo pipefail
          cli=apps/desktop/release/win-unpacked/resources/bin/realm.cmd
          try() {
            export REALM_HOME="$RUNNER_TEMP/unpacked-home-$1"
            "$cli" serve > "$RUNNER_TEMP/u.out" 2> "$RUNNER_TEMP/u.err" & s=$!
            for _ in $(seq 300); do grep -q '"ready"' "$RUNNER_TEMP/u.out" && break; kill -0 $s 2> /dev/null || break; sleep 0.2; done
            echo "== $1"; cat "$RUNNER_TEMP/u.out"; grep -v ExperimentalWarning "$RUNNER_TEMP/u.err" | grep -v trace-warnings | head -5
            "$cli" status
            taskkill //F //T //IM Realm.exe > /dev/null 2>&1; sleep 1
          }
          { try "as built"
            mv apps/desktop/.pack-stage apps/desktop/.pack-stage.away
            try ".pack-stage moved away"
            mv apps/desktop/.pack-stage.away apps/desktop/.pack-stage
          } 2>&1 | tee "$RUNNER_TEMP/unpacked.txt"
          sed 's/^/    /' "$RUNNER_TEMP/unpacked.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          if-no-files-found: error
          compression-level: 0
          path: apps/desktop/release/*.exe

  install:
    name: installed ${{ matrix.label }}
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fix
            works: true
          - label: base
          - label: v2.5.0
            asset: Realm-Setup-2.5.0.exe
            sha256: 3b25272740d96d30f641cd00a29474ce745ca77e432f98edb32a5237a41d1705
          - label: v2.4.0
            asset: Realm-Setup-2.4.0.exe
            sha256: 424c2f2b94a1809a2c014bcf6516165152f1003f2ae732a5bdb105396f59a397
          - label: v2.3.0
            asset: Realm-Setup-2.3.0.exe
            sha256: 56f23d2d3f3fcbfb6d02cd640f7a9259d589007e5eb1cd21cf603b334dbde6c8
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.asset }}
        with:
          name: installer-${{ matrix.label }}
          path: ${{ runner.temp }}/installer

      - name: Download the published installer
        if: ${{ matrix.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installer" && cd "$RUNNER_TEMP/installer"
          curl -fsSL -o "${{ matrix.asset }}" "https://github.com/31Carlton7/realm/releases/download/${{ matrix.label }}/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.asset }}" | sha256sum -c

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem "$env:RUNNER_TEMP\installer\*.exe" | Select-Object -First 1
          $took = Measure-Command { Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\RealmApp" -Wait }
          $server = "$env:RUNNER_TEMP\RealmApp\resources\server"
          $all = @(Get-ChildItem -LiteralPath $server -Recurse -Force)
          $links = @($all | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          $files = @($all | Where-Object { -not $_.PSIsContainer })
          & {
            "installer: {0}, {1:N0} bytes; installed in {2:N0} s" -f $exe.Name, $exe.Length, $took.TotalSeconds
            "installed resources\server: {0} links, {1} files, {2:N1} MB" -f $links.Count, $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
            "resources\server\node_modules holds: " + ((Get-ChildItem -Force "$server\node_modules" | Select-Object -ExpandProperty Name) -join ' ')
          } | Tee-Object -FilePath "$env:RUNNER_TEMP\installed.txt"
          Get-Content "$env:RUNNER_TEMP\installed.txt" | ForEach-Object { "    $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "CLI=$env:RUNNER_TEMP\RealmApp\resources\bin\realm.cmd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: realm serve, realm status
        shell: bash
        env:
          REALM_ENABLE_FAKE_AGENT: "1"
          REALM_PORT: "8796"
        run: |
          set +e -uo pipefail
          export REALM_HOME="$RUNNER_TEMP/serve-home"
          app="$RUNNER_TEMP/RealmApp"
          # 2.3.0 and 2.4.0 shipped no resources\bin\realm: their server starts the way the app starts it,
          # on Realm.exe as Node.
          if [ -f "$app/resources/bin/realm.cmd" ]; then "$CLI" serve > "$RUNNER_TEMP/serve.out" 2> "$RUNNER_TEMP/serve.err" & s=$!
          else ELECTRON_RUN_AS_NODE=1 "$app/Realm.exe" "$app/resources/server/dist/main.js" > "$RUNNER_TEMP/serve.out" 2> "$RUNNER_TEMP/serve.err" & s=$!
          fi
          start=$SECONDS
          for _ in $(seq 600); do grep -q '"ready"' "$RUNNER_TEMP/serve.out" && break; kill -0 $s 2> /dev/null || break; sleep 0.2; done
          {
            echo "serve: $((SECONDS - start)) s"
            cat "$RUNNER_TEMP/serve.out"; grep -v ExperimentalWarning "$RUNNER_TEMP/serve.err" | grep -v trace-warnings | head -5
            if [ -f "$app/resources/bin/realm.cmd" ]; then "$CLI" status; "$CLI" --json status; fi
          } 2>&1 | tee "$RUNNER_TEMP/serve.txt"
          # Where the server came up, the bench's lane A once: a repository, a command in a worktree of its
          # own, in a ConPTY terminal (so node-pty loads from this tree), and its log.
          if grep -q '"ready"' "$RUNNER_TEMP/serve.out" && [ -f "$app/resources/bin/realm.cmd" ]; then
            repo="$RUNNER_TEMP/repo"
            mkdir -p "$repo" && (cd "$repo" && git init -q -b main && echo hi > a.txt && git add a.txt &&
              git -c user.name=ci -c user.email=ci@example.com -c commit.gpgsign=false commit -qm base)
            {
              "$CLI" --json repo add "$repo"
              "$CLI" --json run "$repo" --worktree w1 -- "echo packaged-cli-ok"
              "$CLI" --json wait --timeout 60
              "$CLI" ps
              t=$("$CLI" --json ps | sed -n 's/.*"terminalId":"\([^"]*\)".*/\1/p' | head -1)
              "$CLI" logs "$t" | tee "$RUNNER_TEMP/logs.txt"
            } 2>&1 | tee -a "$RUNNER_TEMP/serve.txt"
          fi
          sed 's/^/    /' "$RUNNER_TEMP/serve.txt" >> "$GITHUB_STEP_SUMMARY"
          taskkill //F //T //IM Realm.exe > /dev/null 2>&1
          if [ "${{ matrix.works }}" = true ]; then
            grep -q "Realm 2.5.0 is running on" "$RUNNER_TEMP/serve.txt" && grep -v "echo packaged-cli-ok" "$RUNNER_TEMP/logs.txt" | grep -q packaged-cli-ok
          fi

      # What every Claude session spawns: the Agent SDK's own claude.exe, found from the SDK the way
      # sdk.mjs (and packages/adapters' probe.ts) finds it.
      - name: The Agent SDK finds its claude.exe
        shell: bash
        run: |
          set +e -uo pipefail
          app="$RUNNER_TEMP/RealmApp"
          ELECTRON_RUN_AS_NODE=1 "$app/Realm.exe" -e '
            const { createRequire } = require("node:module");
            const sdk = createRequire(process.argv[1]).resolve("@anthropic-ai/claude-agent-sdk");
            console.log(createRequire(sdk).resolve("@anthropic-ai/claude-agent-sdk-win32-x64/claude.exe"));
          ' "$app/resources/server/dist/main.js" > "$RUNNER_TEMP/claude-path.txt" 2> "$RUNNER_TEMP/claude-path.err"
          {
            if [ -s "$RUNNER_TEMP/claude-path.txt" ]; then
              echo "claude.exe: $(cat "$RUNNER_TEMP/claude-path.txt")"
              echo "claude.exe --version: $(timeout 60 "$(tr -d '\r' < "$RUNNER_TEMP/claude-path.txt")" --version 2>&1 | head -1)"
            else
              echo "claude.exe not found: $(grep -m1 -E 'Error|Cannot' "$RUNNER_TEMP/claude-path.err")"
            fi
          } | tee "$RUNNER_TEMP/claude.txt"
          sed 's/^/    /' "$RUNNER_TEMP/claude.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.works }}" = true ]; then grep -q "claude.exe --version: [0-9]" "$RUNNER_TEMP/claude.txt"; fi

      # The app itself, as a person starts it: on Windows it runs its server as a child on a pipe.
      - name: Realm.exe starts its server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $app = "$env:RUNNER_TEMP\RealmApp"
          $env:REALM_HOME = "$env:RUNNER_TEMP\app-home"
          $env:REALM_PORT = "8797"
          $env:REALM_ENABLE_FAKE_AGENT = "1"
          $p = Start-Process -FilePath "$app\Realm.exe" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\app.out" -RedirectStandardError "$env:RUNNER_TEMP\app.err"
          $start = Get-Date
          while (((Get-Date) - $start).TotalSeconds -lt 90 -and -not (Test-Path "$env:REALM_HOME\daemon.json") -and -not $p.HasExited) { Start-Sleep -Milliseconds 250 }
          $up = ((Get-Date) - $start).TotalSeconds
          Start-Sleep -Seconds 3
          $status = if (Test-Path "$app\resources\bin\realm.cmd") { & "$app\resources\bin\realm.cmd" status 2>&1 | Out-String } else { "(this release has no resources\bin\realm)" }
          & {
            "daemon.json after {0:N1} s: {1}; app exited: {2}" -f $up, (Test-Path "$env:REALM_HOME\daemon.json"), $p.HasExited
            "realm status: $($status.Trim())"
            "Realm.exe processes:"
            Get-CimInstance Win32_Process -Filter "Name = 'Realm.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { "  pid {0} (parent {1}): {2}" -f $_.ProcessId, $_.ParentProcessId, $_.CommandLine }
            "app stderr, the lines that are not Chromium's:"
            Get-Content "$env:RUNNER_TEMP\app.err" -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch '^\[\d+:\d+/' -and $_ -notmatch 'ExperimentalWarning|trace-warnings' } | Select-Object -First 15 | ForEach-Object { "  $_" }
          } | Tee-Object -FilePath "$env:RUNNER_TEMP\app.txt"
          Get-Content "$env:RUNNER_TEMP\app.txt" | ForEach-Object { "    $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Process Realm -ErrorAction SilentlyContinue | Stop-Process -Force
          if ("${{ matrix.works }}" -eq "true" -and $status -notmatch "Realm 2.5.0 is running on") { throw "the installed app did not start its server" }

  # 2.5.0 installed, then updated, as anyone who has it will be: the new installer runs the old install's own
  # uninstaller with --updated, which first moves every file into %TEMP%\nsXXXX.tmp\old-install.
  upgrade:
    name: ${{ matrix.mode }} v2.5.0
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        mode: [uninstall as an update does, fix installed over]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-fix
          path: ${{ runner.temp }}/installer

      - name: Install 2.5.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "$env:RUNNER_TEMP\Realm-Setup-2.5.0.exe"
          curl.exe -fsSL -o $exe "https://github.com/31Carlton7/realm/releases/download/v2.5.0/Realm-Setup-2.5.0.exe"
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne "3b25272740d96d30f641cd00a29474ce745ca77e432f98edb32a5237a41d1705") { throw "sha256 mismatch" }
          Start-Process -FilePath $exe -ArgumentList '/S', "/D=$env:RUNNER_TEMP\RealmApp" -Wait
          $app = "$env:RUNNER_TEMP\RealmApp"
          $longest = Get-ChildItem -LiteralPath $app -Recurse -Force -File | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          $rel = $longest.FullName.Length - $app.Length
          & {
            "2.5.0 installed in $app; its longest path is $($longest.FullName.Length) characters, $rel of them below the install folder:"
            "  $($longest.FullName)"
            "moved into $env:TEMP\nsXXXX.tmp\old-install by an update, that file's path would be about $($rel + "$env:TEMP\nsa0000.tmp\old-install".Length) characters (Windows' MAX_PATH is 260)"
          } | Tee-Object -FilePath "$env:RUNNER_TEMP\installed.txt"
          Get-Content "$env:RUNNER_TEMP\installed.txt" | ForEach-Object { "    $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $app = "$env:RUNNER_TEMP\RealmApp"
          if ("${{ matrix.mode }}" -like "uninstall*") {
            # What the new installer's uninstallOldVersion runs (app-builder-lib templates/nsis/include/installUtil.nsh).
            Copy-Item "$app\Uninstall Realm.exe" "$env:RUNNER_TEMP\old-uninstaller.exe"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\old-uninstaller.exe" -ArgumentList '/S', '/KEEP_APP_DATA', '/currentuser', '--updated', "_?=$app" -PassThru
          } else {
            $exe = Get-ChildItem "$env:RUNNER_TEMP\installer\*.exe" | Select-Object -First 1
            $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$app" -PassThru
          }
          $done = $p.WaitForExit(240000)
          & {
            if ($done) { "${{ matrix.mode }}: exited with $($p.ExitCode)" } else { "${{ matrix.mode }}: still running after 240 s" }
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "  window: {0} ({1}): {2}" -f $_.ProcessName, $_.Id, $_.MainWindowTitle }
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'uninstall|Setup|Realm|Au_' } | ForEach-Object { "  pid {0} (parent {1}): {2}" -f $_.ProcessId, $_.ParentProcessId, $_.CommandLine }
            "files left in the install folder: " + @(Get-ChildItem -LiteralPath $app -Recurse -Force -File -ErrorAction SilentlyContinue).Count
            "resources\server\node_modules holds: " + ((Get-ChildItem -Force "$app\resources\server\node_modules" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ' ')
          } | Tee-Object -FilePath "$env:RUNNER_TEMP\result.txt"
          Get-Content "$env:RUNNER_TEMP\result.txt" | ForEach-Object { "    $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\screen.png")
          if (-not $done) { Stop-Process -Id $p.Id -Force; Get-Process | Where-Object { $_.ProcessName -match 'uninstall|Setup|Au_' } | Stop-Process -Force }
          exit 0

      - name: realm serve, realm status
        if: ${{ matrix.mode == 'fix installed over' }}
        shell: bash
        env:
          REALM_ENABLE_FAKE_AGENT: "1"
          REALM_PORT: "8796"
        run: |
          set +e -uo pipefail
          export REALM_HOME="$RUNNER_TEMP/serve-home"
          cli="$RUNNER_TEMP/RealmApp/resources/bin/realm.cmd"
          "$cli" serve > "$RUNNER_TEMP/serve.out" 2> "$RUNNER_TEMP/serve.err" & s=$!
          for _ in $(seq 300); do grep -q '"ready"' "$RUNNER_TEMP/serve.out" && break; kill -0 $s 2> /dev/null || break; sleep 0.2; done
          { cat "$RUNNER_TEMP/serve.out"; grep -v ExperimentalWarning "$RUNNER_TEMP/serve.err" | grep -v trace-warnings | head -5; "$cli" status; } 2>&1 | tee "$RUNNER_TEMP/serve.txt"
          sed 's/^/    /' "$RUNNER_TEMP/serve.txt" >> "$GITHUB_STEP_SUMMARY"
          taskkill //F //T //IM Realm.exe > /dev/null 2>&1
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.mode }}
          path: ${{ runner.temp }}/screen.png
