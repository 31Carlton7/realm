# Starts the Swift helpers on the oldest macOS GitHub runs, so a helper the app ships cannot need a
# newer macOS than the app does without this failing (#411: 2.11.1's were built for 27.2, the OS of the
# Mac that built them, while the app says it runs on 13.0). GitHub no longer runs macos-14, so the
# oldest is macos-15.
#
#   - Built: compiles the helpers on the newest runner, as a release Mac on a newer macOS would, and
#     starts them on macOS 15. Fails when one does not start.
#   - Published (run by hand, with a release tag): starts the helpers inside that release's dmg on
#     macOS 15, to see what a shipped build does.
name: Native helpers

on:
  pull_request:
    paths:
      - apps/desktop/native/**
      - apps/desktop/scripts/build-native.mjs
      - apps/desktop/scripts/lib/macos-minimum.mjs
      - apps/desktop/scripts/native-helpers.mjs
      - apps/desktop/scripts/start-native-helpers.mjs
      - .github/workflows/native-helpers.yml
  workflow_dispatch:
    inputs:
      release:
        description: A published release whose helpers to start, such as v2.12.0. Empty starts the ones built from this ref.
        required: false
        default: ""

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || inputs.release == ''
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sw_vers && xcrun swiftc --version
      - run: node apps/desktop/scripts/build-native.mjs
      - run: node apps/desktop/scripts/native-helpers.mjs check apps/desktop/native/bin
      - uses: actions/upload-artifact@v4
        with:
          name: native-helpers
          path: apps/desktop/native/bin/
          if-no-files-found: error

  start-built:
    name: Start built (macos-15)
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: native-helpers
          path: helpers
      # An artifact keeps no file modes.
      - run: chmod +x helpers/*
      - run: node apps/desktop/scripts/start-native-helpers.mjs helpers

  start-published:
    name: Start ${{ inputs.release }} (macos-15)
    if: inputs.release != ''
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*-arm64.dmg' --dir dmg
      - run: |
          hdiutil attach -nobrowse -readonly -mountpoint mnt dmg/*.dmg
          mkdir helpers
          for helper in scrollphase axhelper phonescreen deviceowner policystamp realmkeychain; do
            cp "mnt/Realm.app/Contents/Resources/$helper" helpers/
            otool -l "helpers/$helper" | grep -A3 LC_BUILD_VERSION | grep -E 'minos|sdk' | xargs echo "$helper:"
          done
          hdiutil detach mnt
      - run: node apps/desktop/scripts/start-native-helpers.mjs helpers
