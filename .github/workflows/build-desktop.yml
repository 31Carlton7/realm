# Builds Realm's desktop app on each OS it runs on (docs/platforms.md): lint, typecheck, test, build,
# then package unsigned artifacts — a dmg and zip on macOS, an AppImage and a deb on Linux, an NSIS
# installer on Windows. Nothing is signed and nothing is published: `pnpm release` is still how a Mac
# release ships.
#
# The work is split into jobs that run side by side, so a run takes as long as its slowest job rather
# than the sum of them. A pull request that changes only the website, the docs or the repo's prose
# (scripts/ci-changes.mjs) skips everything but Lint.
#
# What runs where:
#   - every run: Lint, Typecheck, the whole suite on macOS in shards, and a build on each OS, with the
#     tests of the platform branches on Linux and Windows.
#   - pushes to main, runs by hand, and release branches (integration/*): the installers, kept as the
#     artifacts realm-macOS, realm-Linux and realm-Windows. Other pull requests package an unpacked app
#     instead, which runs the same staging and electron-builder without making installers.
#   - pushes to main and runs by hand: the whole suite on Linux and Windows, for information. Run the
#     workflow by hand on a branch to see it there.
#
# Runners: each job runs on the repository variable RUNNER_MACOS, RUNNER_LINUX or RUNNER_WINDOWS when it
# is set, and on GitHub's own runner when it is not, so moving to other machines needs no edit here.
# Test workers follow the runner's cores (--maxWorkers=100%).
name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Unsigned on every OS: never go looking for a signing identity in the runner's keychain.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  changes:
    name: Changes
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      # The whole history without file contents (blobless), so the pull request's merge base is here to
      # diff against; contents are fetched only for the files checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          hugeicons-token: ${{ secrets.HUGEICONS_TOKEN }}
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          hugeicons-token: ${{ secrets.HUGEICONS_TOKEN }}
      - run: pnpm -r typecheck

  # The whole suite was written on a Mac — live ptys under /bin/sh, POSIX paths in fixtures — so it gates
  # the Mac. Linux and Windows are gated on the tests that exercise their branches with the platform
  # injected (in Build), and run the rest for information until it is made portable.
  test:
    name: Test (macOS ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          hugeicons-token: ${{ secrets.HUGEICONS_TOKEN }}
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3 --maxWorkers=100%

  test-informational:
    name: Test (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }}, informational)
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # Information only: a failure here does not fail the run.
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}", shards: 3, shard: 1 }
          - { os: Linux, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}", shards: 3, shard: 2 }
          - { os: Linux, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}", shards: 3, shard: 3 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 1 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 2 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 3 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 4 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 5 }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", shards: 6, shard: 6 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          hugeicons-token: ${{ secrets.HUGEICONS_TOKEN }}
      - run: pnpm vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }} --maxWorkers=100%

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, runner: "${{ vars.RUNNER_MACOS || 'macos-latest' }}", dist: dist }
          - { os: Linux, runner: "${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}", dist: "dist:linux" }
          - { os: Windows, runner: "${{ vars.RUNNER_WINDOWS || 'windows-latest' }}", dist: "dist:win" }
    env:
      INSTALLERS: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          hugeicons-token: ${{ secrets.HUGEICONS_TOKEN }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test (platform branches)
        if: runner.os != 'macOS'
        run: >-
          pnpm vitest run
          packages/contracts/src/platform.test.ts
          packages/contracts/src/keybindings.test.ts
          packages/contracts/src/terminal-programs.test.ts
          packages/contracts/src/mention-refs.test.ts
          packages/adapters/src/spawn-target.test.ts
          apps/server/src/paths.test.ts
          apps/desktop/src/main/window-chrome.test.ts
          apps/desktop/src/renderer/src/keys/chord.test.ts
          apps/desktop/src/renderer/src/platform.test.ts
          apps/desktop/src/renderer/src/platform-gates.test.ts

      - name: Build
        run: pnpm build

      - name: Package (unsigned)
        if: env.INSTALLERS == 'true'
        run: pnpm --filter @realm/desktop ${{ matrix.dist }}

      - name: Package (unpacked)
        if: env.INSTALLERS != 'true'
        run: pnpm --filter @realm/desktop dist:dir

      - uses: actions/upload-artifact@v4
        if: env.INSTALLERS == 'true'
        with:
          name: realm-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
