# Node 22, pnpm and the workspace's dependencies, for every job in build-desktop.yml.
#
# node_modules and the pnpm store are cached per OS and keyed on the lockfile. Only pushes to main write
# them (save-cache): a pull request can read main's caches but not another branch's, so a cache written
# on a pull request would serve nothing but that pull request's reruns, and push main's out of the 10 GB.
# With node_modules restored, `pnpm install` finds it up to date and links nothing; the store is fetched
# only when node_modules missed, so a changed lockfile downloads just what changed.
#
# Windows caches the store alone. pnpm links node_modules there with junctions, which come back from the
# cache's tar as entries pnpm cannot follow (EPERM on realpath), so it installs from the store each time.
#
# Electron's binary is not in node_modules: the electron package downloads it from GitHub the first time
# something loads it, which in a test job is a test file partway through the suite, and a failed download
# there fails that file at import. So it is put in place here, from @electron/get's own cache of the zip
# (keyed on the lockfile's Electron version), and the job stops if it is not there after three tries.
name: Set up
description: Node, pnpm and the workspace's dependencies, restored from main's cache.

inputs:
  hugeicons-token:
    description: The HUGEICONS_TOKEN secret, which installs @hugeicons-pro. A pull request from a fork has none.
    required: false
  save-cache:
    description: Whether to write node_modules and the store back to the cache when they were not restored.
    default: "false"
  electron:
    description: Whether to put Electron's binary in place. Lint and Typecheck never run it.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # @hugeicons-pro is a paid package on Hugeicons' own registry. Written to the user .npmrc so it never
    # lands in the checkout. A pull request from a fork is given no secrets, so it skips this and builds
    # with the free pack under the same names (docs/dev/hugeicons.md). Every other run still needs it.
    - name: Hugeicons registry
      if: ${{ !github.event.pull_request.head.repo.fork }}
      shell: bash
      env:
        HUGEICONS_TOKEN: ${{ inputs.hugeicons-token }}
      run: |
        test -n "$HUGEICONS_TOKEN" || { echo "::error::Set the HUGEICONS_TOKEN repo secret to install @hugeicons-pro"; exit 1; }
        printf '@hugeicons-pro:registry=https://npm.hugeicons.com/\n//npm.hugeicons.com/:_authToken=%s\n' "$HUGEICONS_TOKEN" >> ~/.npmrc

    # A fork's caches are named apart from main's, so its run never restores main's copy of the Pro pack.
    - name: Cache keys
      id: keys
      shell: bash
      run: |
        echo "prefix=${{ runner.os }}-${{ runner.arch }}-node$(node -p 'process.versions.node.split(".")[0]')-${{ github.event.pull_request.head.repo.fork && 'free' || 'pro' }}" >> "$GITHUB_OUTPUT"
        echo "lockfile=${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        electron=$(sed -n 's/^  electron@\([0-9][^:(]*\):$/\1/p' pnpm-lock.yaml | head -1)
        test -n "$electron" || { echo "::error::Found no electron@<version> in pnpm-lock.yaml"; exit 1; }
        echo "electron=$electron" >> "$GITHUB_OUTPUT"
        # Where @electron/get keeps the zips it downloads (env-paths' cache directory for "electron").
        case "${{ runner.os }}" in
          macOS) echo "electron-cache=$HOME/Library/Caches/electron" >> "$GITHUB_OUTPUT" ;;
          Linux) echo "electron-cache=${XDG_CACHE_HOME:-$HOME/.cache}/electron" >> "$GITHUB_OUTPUT" ;;
          Windows) echo "electron-cache=$LOCALAPPDATA\\electron\\Cache" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Restore node_modules
      id: modules
      if: runner.os != 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          services/*/node_modules
        key: modules-${{ steps.keys.outputs.prefix }}-${{ steps.keys.outputs.lockfile }}

    - name: Restore the pnpm store
      id: store
      if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.store }}
        key: store-${{ steps.keys.outputs.prefix }}-${{ steps.keys.outputs.lockfile }}
        restore-keys: store-${{ steps.keys.outputs.prefix }}-

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # The Pro pack is an optional dependency, and pnpm skips one it cannot fetch without failing, so a
    # token that has lapsed would otherwise build with the free pack and say nothing.
    - name: Hugeicons Pro installed
      if: ${{ !github.event.pull_request.head.repo.fork }}
      shell: bash
      run: test -e packages/ui/node_modules/@hugeicons-pro/core-stroke-rounded/package.json || { echo "::error::@hugeicons-pro did not install; check the HUGEICONS_TOKEN repo secret"; exit 1; }

    - name: Save node_modules
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true' && runner.os != 'Windows'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          services/*/node_modules
        key: modules-${{ steps.keys.outputs.prefix }}-${{ steps.keys.outputs.lockfile }}

    - name: Save the pnpm store
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true' && steps.store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.keys.outputs.store }}
        key: store-${{ steps.keys.outputs.prefix }}-${{ steps.keys.outputs.lockfile }}

    - name: Restore the Electron download
      id: electron
      if: inputs.electron == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.keys.outputs.electron-cache }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.electron }}

    # Only the install is tried again, never a test. install.js returns at once when the binary is
    # already there, and takes the zip from the cache above when it was restored.
    - name: Install Electron's binary
      if: inputs.electron == 'true'
      shell: bash
      env:
        VERSION: ${{ steps.keys.outputs.electron }}
      run: |
        electron=apps/desktop/node_modules/electron
        installed() { test -f "$electron/path.txt" && test -f "$electron/dist/$(cat "$electron/path.txt")"; }
        for attempt in 1 2 3; do
          node "$electron/install.js" && installed && exit 0
          echo "::warning::Electron $VERSION's binary did not install (attempt $attempt of 3)"
          sleep $((attempt * 15))
        done
        echo "::error::Electron $VERSION's binary is not in $electron/dist after three tries. Downloading it from GitHub failed; every test file that loads Electron would fail at import."
        exit 1

    # Written from any run that missed, pull requests included: the key changes only with Electron's
    # version, so main's copy serves every pull request after its first run, and one that bumps Electron
    # saves the new zip, which its reruns then read.
    - name: Save the Electron download
      if: inputs.electron == 'true' && steps.electron.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.keys.outputs.electron-cache }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.electron }}
