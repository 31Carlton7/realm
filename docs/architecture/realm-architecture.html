/* Realm's own tokens (apps/desktop/src/renderer/src/theme/tokens.css), dark first. */
:root {
  color-scheme: dark;
  --page: oklch(0.209 0.004 264.477);
  --canvas: oklch(0.231 0.004 264.487);
  --surface: oklch(0.26 0.006 271.191);
  --inset: oklch(0.243 0.004 264.492);
  --hover: oklch(0.289 0.006 271.22);
  --ink: oklch(0.964 0.002 247.839);
  --ink-2: oklch(0.731 0.008 260.731);
  --ink-3: oklch(0.541 0.01 264.484);
  --accent: oklch(0.68 0.173 253.301);
  --accent-ink: oklch(0.788 0.113 248.33);
  --accent-tint: oklch(0.68 0.173 253.301 / 0.16);
  --line: #ffffff0f;
  --line-strong: #ffffff14;
  --mark: #ffffff29;
  --edge: oklch(0.731 0.008 260.731 / 0.72);
  --group: oklch(1 0 0 / 0.025);
  --font-ui: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
:root[data-mode="light"] {
  color-scheme: light;
  --page: oklch(0.968 0.004 264);
  --canvas: oklch(0.985 0.002 264);
  --surface: oklch(1 0 0);
  --inset: oklch(0.998 0.002 264);
  --hover: oklch(0.971 0.003 264);
  --ink: oklch(0.235 0.006 264);
  --ink-2: oklch(0.459 0.01 264);
  --ink-3: oklch(0.531 0.01 264);
  --accent: oklch(0.6 0.2 256);
  --accent-ink: oklch(0.52 0.19 257);
  --accent-tint: oklch(0.959 0.021 256);
  --line: #0000000f;
  --line-strong: #0000001f;
  --mark: #00000029;
  --edge: oklch(0.459 0.01 264 / 0.7);
  --group: oklch(0 0 0 / 0.022);
}

html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden;
  font: 450 14px/20px var(--font-ui); -webkit-font-smoothing: antialiased; font-synthesis: none; }
svg#map { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
svg#map.dragging { cursor: grabbing; }

/* the drawing */
.g-region { fill: var(--group); stroke: var(--line-strong); stroke-width: 1; }
.g-region.mac { fill: none; stroke: var(--mark); }
.g-region.outside, .g-region.branch { fill: none; stroke: var(--mark); stroke-dasharray: 8 6; }
.g-title { font: 560 24px var(--font-ui); letter-spacing: -0.36px; fill: var(--ink); }
.g-sub { font: 450 14px var(--font-ui); fill: var(--ink-2); }
.g-title.small { font-size: 20px; letter-spacing: -0.3px; }

.n-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.n.store .n-box { fill: var(--inset); stroke: var(--mark); }
.n.proc .n-box { fill: var(--surface); stroke: var(--mark); }
.n.ext .n-box { fill: none; stroke: var(--mark); stroke-dasharray: 6 5; }
.n.key .n-box { fill: var(--hover); stroke: var(--mark); }
.n-title { font: 560 18px var(--font-ui); letter-spacing: -0.27px; fill: var(--ink); }
.n-sub { font: 450 14px var(--font-ui); fill: var(--ink-2); }
.n-file { font: 400 12px var(--font-mono); fill: var(--ink-3); }
.n { cursor: pointer; }
.n:hover .n-box { stroke: var(--accent); }

.e-path { fill: none; stroke: var(--edge); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.e.plain .e-path { stroke: var(--ink-3); stroke-width: 1.3; }
.e.rpc .e-path { stroke: var(--accent); stroke-width: 2.4; }
.e.ipc .e-path { stroke-dasharray: 10 4 2 4; stroke-linecap: butt; }
.e.http .e-path { stroke-dasharray: 9 5; stroke-linecap: butt; }
.e.cdp .e-path { stroke-dasharray: 2 5; }
.e.file .e-path { stroke-dasharray: 0.1 6; stroke-width: 2.6; }
.e.net .e-path { stroke-dasharray: 16 6; stroke-linecap: butt; }
.e-label-bg { fill: var(--page); }
.e-label { font: 400 12px var(--font-mono); fill: var(--ink-2); }
.e.rpc .e-label { fill: var(--accent-ink); }
.arrow { fill: var(--edge); }
.arrow.rpc { fill: var(--accent); }

.title { font: 560 40px var(--font-ui); letter-spacing: -0.6px; fill: var(--ink); }

  { a: "agents", b: "gateway", k: "http", ao: 110, bo: 0, mid: 2565, l: "MCP over HTTP", lat: [2565, 610] },
  { a: "hub", b: "stdio", k: "spawn", ao: -30 },
  { a: "terminals", b: "shells", k: "spawn" },
  { a: "codereview", b: "gh", k: "spawn" },
  { a: "simulators", b: "servesim", k: "spawn", ao: 1153 - 1254 },
  { a: "simulators", b: "devices", k: "spawn", ao: 1257 - 1254 },
  { a: "simulators", b: "phonescreen", k: "spawn", ao: 1358 - 1254 },
  { a: "laya", b: "layaserve", k: "http" },
  { a: "machines", b: "qemu", k: "spawn" },
  { a: "checkpoints", b: "git", k: "spawn" },
  { a: "git", b: "checkouts", k: "file", sides: ["b", "t"] },

  /* the app and the Mac */
  { a: "secrets", b: "keychain", k: "file", sides: ["l", "l"], via: [[122, 1380], [122, 2005]], l: "safeStorage", lat: [122, 1860] },
  { a: "helpers", b: "otherapps", k: "plain", sides: ["b", "t"], l: "AX, CGEvent", lat: [810, 1865] },

  /* off the Mac */
  { a: "agents", b: "providers", k: "net", ao: -50, bo: 0 },
  { a: "hub", b: "vendors", k: "http", ao: 35, bo: -5, l: "MCP over HTTP", lat: [3300, 850] },
  { a: "site", b: "gateway", k: "net", ao: 15, bo: 35, l: "OAuth redirect to 127.0.0.1", lat: [2990, 700] },
  { a: "gh", b: "github", k: "net", bo: -11 },
  { a: "updater", b: "github", k: "net", sides: ["l", "l"], bo: 40, via: [[96, 1525], [96, 2190], [3320, 2190], [3320, 1100]], l: "the update feed", lat: [1700, 2190] },
  { a: "layaserve", b: "pypi", k: "net", bo: -1 },
  { a: "iphone", b: "relay", k: "net", both: true, sides: ["b", "t"], l: "WebSocket" },
];

const LEGEND = [
  ["rpc", "WebSocket RPC, realm.<token>"],
  ["plain", "a call inside one process"],
  ["ipc", "Electron IPC, preload bridge"],
  ["spawn", "child process, stdio"],
  ["http", "HTTP: MCP, previews, vendors"],
  ["cdp", "DevTools Protocol"],
  ["file", "disk"],
  ["net", "internet"],
];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const world = document.getElementById("world");
const el = (name, attrs = {}, parent) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};
const text = (parent, x, y, cls, str) => { const t = el("text", { x, y, class: cls }, parent); t.textContent = str; return t; };

/* arrowheads, one per edge colour */
const defs = document.getElementById("defs");
for (const k of ["plain", "rpc"]) {
  const m = el("marker", { id: `arrow-${k}`, viewBox: "0 0 10 10", refX: 8.5, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs);
  m.setAttribute("markerWidth", 11); m.setAttribute("markerHeight", 11);
  el("path", { d: "M 0 1 L 9 5 L 0 9 z", class: `arrow ${k === "rpc" ? "rpc" : ""}` }, m);
}

const byId = new Map(NODES.map((n) => [n.id, n]));

/* ── regions ── */
const regionLayer = el("g", {}, world);
for (const r of REGIONS) {
  const g = el("g", {}, regionLayer);
  el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: r.kind === "mac" ? 28 : 20, class: `g-region ${r.kind ?? ""}` }, g);
  text(g, r.x + 24, r.y + 38, `g-title ${r.small ? "small" : ""}`, r.t);
  if (r.s) text(g, r.x + 24, r.y + 62, "g-sub", r.s);
}

/* ── edges (under the boxes) ── */
const edgeLayer = el("g", {}, world);
const labelLayer = el("g", {}, world);
const nodeLayer = el("g", {}, world);

function anchor(n, side, offset = 0) {
  if (side === "l") return [n.x, n.y + n.h / 2 + offset];
  if (side === "r") return [n.x + n.w, n.y + n.h / 2 + offset];
  if (side === "t") return [n.x + n.w / 2 + offset, n.y];
  return [n.x + n.w / 2 + offset, n.y + n.h];
}
function autoSides(a, b) {
  if (a.x + a.w <= b.x) return ["r", "l"];
  if (b.x + b.w <= a.x) return ["l", "r"];
  if (a.y + a.h <= b.y) return ["b", "t"];
  return ["t", "b"];
}
/** Orthogonal route between two anchors, leaving each side squarely. */
function orth(p, sp, q, sq, mid) {
  const horiz = (s) => s === "l" || s === "r";
  if (horiz(sp) && horiz(sq)) {
    if (Math.abs(p[1] - q[1]) < 1) return [p, q];
    const mx = mid ?? (p[0] + q[0]) / 2;
    return [p, [mx, p[1]], [mx, q[1]], q];
  }
  if (!horiz(sp) && !horiz(sq)) {
    if (Math.abs(p[0] - q[0]) < 1) return [p, q];
    const my = mid ?? (p[1] + q[1]) / 2;
    return [p, [p[0], my], [q[0], my], q];
  }
  return horiz(sp) ? [p, [q[0], p[1]], q] : [p, [p[0], q[1]], q];
}
function rounded(points, r = 12) {
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length - 1; i++) {
    const [px, py] = points[i - 1], [x, y] = points[i], [nx, ny] = points[i + 1];
    const d1 = Math.hypot(x - px, y - py), d2 = Math.hypot(nx - x, ny - y);
    const k = Math.min(r, d1 / 2, d2 / 2);
    const ax = x - ((x - px) / d1) * k, ay = y - ((y - py) / d1) * k;
    const bx = x + ((nx - x) / d2) * k, by = y + ((ny - y) / d2) * k;
    d += ` L ${ax} ${ay} Q ${x} ${y} ${bx} ${by}`;
  }
  const last = points[points.length - 1];
  return d + ` L ${last[0]} ${last[1]}`;
}

const edgeEls = [];
for (const e of EDGES) {
  const a = byId.get(e.a), b = byId.get(e.b);
  if (!a || !b) { console.warn("edge with a missing end", e); continue; }
  const [sa, sb] = e.sides ?? autoSides(a, b);
  const p = anchor(a, sa, e.ao ?? 0), q = anchor(b, sb, e.bo ?? 0);
  const pts = e.via ? [p, ...e.via, q] : orth(p, sa, q, sb, e.mid);
  const g = el("g", { class: `e ${e.k}` }, edgeLayer);
  const arrow = `url(#arrow-${e.k === "rpc" ? "rpc" : "plain"})`;
  el("path", { d: rounded(pts), class: "e-path", "marker-end": arrow, ...(e.both ? { "marker-start": arrow } : {}) }, g);
  if (e.l) {
    // the label sits on the longest straight run, or where the edge says
    let best = 0, at = [0, 0];
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      if (len > best) { best = len; at = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]; }
    }
    if (e.lat) at = e.lat;
    const lg = el("g", { class: `e ${e.k}` }, labelLayer);
    const lines = e.l.split("\n");
    const ts = lines.map((line, i) => text(lg, at[0], at[1] + 4 + (i - (lines.length - 1) / 2) * 15, "e-label", line));
    ts.forEach((t) => t.setAttribute("text-anchor", "middle"));
    requestAnimationFrame(() => {
      const box = lg.getBBox();
      const bg = el("rect", { x: box.x - 6, y: box.y - 2, width: box.width + 12, height: box.height + 4, rx: 6, class: "e-label-bg" });
      lg.insertBefore(bg, lg.firstChild);
    });
    edgeEls.push({ e, g: [g, lg] });
  } else edgeEls.push({ e, g: [g] });
}

/* ── nodes ── */
const nodeEls = new Map();
const overflow = [];
const PAD = 16;
function fitPath(t, width) {
  // a path too long for its box keeps its tail: the file is the part a reader looks for
  const full = t.textContent;
  if (t.getComputedTextLength() <= width) return;
  const parts = full.split("/");
  for (let i = 1; i < parts.length; i++) {
    t.textContent = "…/" + parts.slice(i).join("/");
    if (t.getComputedTextLength() <= width) return;
  }
}
for (const n of NODES) {
  const g = el("g", { class: `n ${n.kind ?? ""} ${n.key ? "key" : ""}`, tabindex: 0, role: "button", "aria-label": `${n.t}. ${(n.s ?? "").replace(/\n/g, " ")}` }, nodeLayer);
  el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 12, class: "n-box" }, g);
  const subs = (n.s ?? "").split("\n").filter(Boolean);
  const files = n.hideFiles ? [] : (n.f ?? []).slice(0, n.showFiles ?? 2);
  const blockH = 22 + subs.length * 20 + (files.length ? 6 + files.length * 17 : 0);
  let y = n.y + (n.h - blockH) / 2 + 17;
  const lines = [text(g, n.x + PAD, y, "n-title", n.t)];
  for (const line of subs) { y += 20; lines.push(text(g, n.x + PAD, y, "n-sub", line)); }
  if (files.length) { y += 6; for (const f of files) { y += 17; fitPath(text(g, n.x + PAD, y, "n-file", f), n.w - PAD * 2); } }
  for (const t of lines) if (t.getComputedTextLength() > n.w - PAD * 2) overflow.push(`${n.id}: ${t.textContent}`);
  nodeEls.set(n.id, g);
}
window.__overflow = overflow;

/* ── title and legend ── */
const head = el("g", {}, world);
text(head, 60, 82, "title", "How Realm is built");
text(head, 60, 116, "lede", "Realm 2.3.0, read from the code on 18 October 2026. Each box names the code it stands for; each line's style says what carries it.");
const legend = el("g", {}, world);
let lx = 2380;
text(legend, lx, 66, "legend-title", "Lines");
LEGEND.forEach(([k, label], i) => {
  const col = i % 4, row = Math.floor(i / 4);
  const x = lx + col * 330, y = 92 + row * 26;
  const g = el("g", { class: `e ${k}` }, legend);
  el("path", { d: `M ${x} ${y} L ${x + 64} ${y}`, class: "e-path" }, g);
  text(legend, x + 76, y + 4, "legend-text", label);
});

/* ── focus ── */
const neighbours = new Map(NODES.map((n) => [n.id, new Set([n.id])]));
for (const { e } of edgeEls) { neighbours.get(e.a)?.add(e.b); neighbours.get(e.b)?.add(e.a); }
let pinned = null;
function focus(id) {
  svg.classList.toggle("focusing", Boolean(id));
  const near = id ? neighbours.get(id) : new Set();
  for (const [nid, g] of nodeEls) g.classList.toggle("lit", near.has(nid));
  for (const { e, g } of edgeEls) for (const part of g) part.classList.toggle("lit", Boolean(id) && (e.a === id || e.b === id));
}
const detail = document.getElementById("detail");
function show(id) {
  pinned = id; focus(id);
  if (!id) { detail.classList.remove("open"); return; }
  const n = byId.get(id);
  const lines = EDGES.filter((e) => e.a === id || e.b === id)
    .map((e) => `${e.a === id ? "→ " + byId.get(e.b).t : "← " + byId.get(e.a).t}${e.l ? " (" + e.l.replace(/\n/g, " ") + ")" : ""}`);
  detail.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = n.t; detail.appendChild(h);
  if (n.d || n.s) { const p = document.createElement("p"); p.textContent = n.d ?? n.s.replace(/\n/g, " "); detail.appendChild(p); }
  if (n.f) { const ul = document.createElement("ul"); for (const f of n.f) { const li = document.createElement("li"); li.textContent = f; ul.appendChild(li); } detail.appendChild(ul); }
  if (lines.length) { const p = document.createElement("div"); p.className = "links"; p.textContent = lines.join(" · "); detail.appendChild(p); }
  detail.classList.add("open");
}
for (const [id, g] of nodeEls) {
  g.addEventListener("pointerenter", () => { if (!pinned) focus(id); });
  g.addEventListener("pointerleave", () => { if (!pinned) focus(null); });
  g.addEventListener("click", (ev) => { ev.stopPropagation(); show(pinned === id ? null : id); });
  g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); show(pinned === id ? null : id); } });
}

/* ── pan and zoom ── */
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
function fit() {
  const vw = svg.clientWidth, vh = svg.clientHeight, pad = exporting ? 0 : 24;
  const k = Math.min((vw - pad * 2) / W, (vh - pad * 2) / H);
  view = { k, x: (vw - W * k) / 2, y: (vh - H * k) / 2 };
  apply();
}
function zoomAt(factor, cx = svg.clientWidth / 2, cy = svg.clientHeight / 2) {
  const k = Math.min(6, Math.max(0.12, view.k * factor));
  const f = k / view.k;
  view = { k, x: cx - (cx - view.x) * f, y: cy - (cy - view.y) * f };
  apply();
}
svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  // a pinch sends small deltas, a mouse wheel large ones: clamp so one notch is one step
  if (ev.ctrlKey || ev.metaKey) zoomAt(Math.exp(-Math.max(-50, Math.min(50, ev.deltaY)) * 0.008), ev.offsetX, ev.offsetY);
  else { view.x -= ev.deltaX; view.y -= ev.deltaY; apply(); }
}, { passive: false });
let drag = null;
svg.addEventListener("pointerdown", (ev) => { if (ev.button !== 0) return; drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false }; });
window.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; svg.classList.add("dragging");
  view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
});
window.addEventListener("pointerup", () => { if (drag && !drag.moved) show(null); drag = null; svg.classList.remove("dragging"); });
const modeButton = document.getElementById("mode");
function toggleMode() {
  const light = document.documentElement.dataset.mode !== "light";
  document.documentElement.dataset.mode = light ? "light" : "dark";
  modeButton.textContent = light ? "Dark" : "Light";
}
document.getElementById("fit").onclick = fit;
document.getElementById("zoom-in").onclick = () => zoomAt(1.25);
document.getElementById("zoom-out").onclick = () => zoomAt(0.8);
modeButton.onclick = toggleMode;
window.addEventListener("keydown", (ev) => {
  if (ev.target instanceof HTMLButtonElement && (ev.key === "Enter" || ev.key === " ")) return;
  if (ev.key === "f" || ev.key === "F" || ev.key === "0") fit();
  else if (ev.key === "+" || ev.key === "=") zoomAt(1.25);
  else if (ev.key === "-" || ev.key === "_") zoomAt(0.8);
  else if (ev.key === "l" || ev.key === "L") toggleMode();
  else if (ev.key === "Escape") show(null);
});
window.addEventListener("resize", fit);

if (params.get("mode") === "light") toggleMode();
fit();

window.__drawn = true;
});
</script>
</body>
</html>
