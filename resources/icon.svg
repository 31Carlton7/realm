<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Realm — layered spaces: three rooms stepping toward you along the diagonal, the front one lit.
       Centered composition; palette = the app's own (BUI dark surfaces, accent blue). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242e"/><stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79b8ff"/><stop offset="1" stop-color="#3f88de"/>
    </linearGradient>
    <linearGradient id="frontEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".22" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <!-- trio centered on (512,512): offsets -96/0/+96 along the diagonal, pane 440x440 -->
  <rect x="196" y="196" width="440" height="440" rx="84" fill="none" stroke="#454c5c" stroke-width="36"/>
  <rect x="292" y="292" width="440" height="440" rx="84" fill="none" stroke="#6e788d" stroke-width="36"/>
  <rect x="388" y="388" width="440" height="440" rx="84" fill="url(#front)"/>
  <rect x="388" y="388" width="440" height="440" rx="84" fill="url(#frontEdge)"/>
  <rect x="388" y="388" width="440" height="440" rx="84" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="3"/>
</svg>
