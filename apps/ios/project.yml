name: Realm
options:
  bundleIdPrefix: co.charmtechnologies.realm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FY9QB79VAP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.8.2"
    # The release script overrides this per build; Info.plist reads it as CFBundleVersion.
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
packages:
  RealmKit:
    path: RealmKit
targets:
  Realm:
    type: application
    platform: iOS
    sources:
      - path: Realm
        excludes:
          - Blocks
      # The page that draws TeX and diagrams, with KaTeX and Mermaid beside it: kept as a folder, since
      # the stylesheet finds its fonts by their relative paths.
      - path: Realm/Blocks
        type: folder
        buildPhase: resources
    dependencies:
      - package: RealmKit
        product: RealmKit
      - package: RealmKit
        product: RealmMarkdown
      - target: RealmNotificationService
      - target: RealmShare
      - target: RealmActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios
        PRODUCT_NAME: Realm
        INFOPLIST_FILE: Realm/Info.plist
        CODE_SIGN_ENTITLEMENTS: Realm/Realm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Palette.swift names the colours; generated symbols would collide with SwiftUI's red and green.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  RealmNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: RealmNotificationService
    dependencies:
      - package: RealmKit
        product: RealmKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios.notifications
        PRODUCT_NAME: RealmNotificationService
        INFOPLIST_FILE: RealmNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: RealmNotificationService/RealmNotificationService.entitlements
  # Sharing into Realm from another app. It cannot reach the Mac: it hands the share to the app
  # through the App Group's container, and draws with the app's palette and grounds.
  RealmShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RealmShare
      - path: Realm/Theme/Palette.swift
      - path: Realm/Theme/Surfaces.swift
      - path: Realm/Assets.xcassets
    dependencies:
      - package: RealmKit
        product: RealmKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios.share
        PRODUCT_NAME: RealmShare
        INFOPLIST_FILE: RealmShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: RealmShare/RealmShare.entitlements
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  # A session at work on the Lock Screen and in the Dynamic Island. The app starts, updates and ends
  # the activity from what its channel to the Mac says; this only draws it, with the app's palette and
  # marks.
  RealmActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RealmActivity
      - path: Realm/LiveActivity/WorkActivityAttributes.swift
      - path: Realm/Theme/Palette.swift
      - path: Realm/Theme/Surfaces.swift
      - path: Realm/Theme/TeammateMark.swift
      - path: Realm/Assets.xcassets
    dependencies:
      - package: RealmKit
        product: RealmKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios.activity
        PRODUCT_NAME: RealmActivity
        INFOPLIST_FILE: RealmActivity/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  # The app's own views, drawn and read back: hosted in the app, run with the scheme's tests.
  RealmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RealmTests
    dependencies:
      - target: Realm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Realm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Realm"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Against a staged Mac and relay: scripts/screens-live.mts --ui runs them, phase by phase.
  RealmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RealmUITests
    dependencies:
      - target: Realm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.charmtechnologies.realm.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Realm
schemes:
  Realm:
    build:
      targets:
        Realm: all
        RealmNotificationService: all
        RealmShare: all
        RealmActivity: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RealmTests
    archive:
      config: Release
  RealmLive:
    build:
      targets:
        Realm: all
        RealmNotificationService: all
        RealmShare: all
        RealmActivity: all
    test:
      config: Debug
      targets:
        - RealmUITests
