<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account — Northwind</title>
<style>
  body { font: 15px/1.4 -apple-system, sans-serif; margin: 0; color: #1d1d1f; background: #f5f5f7; }
  header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 20px; }
  main { width: 560px; margin: 24px auto; background: #fff; padding: 24px 28px; border-radius: 10px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 600; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=email], input[type=tel] { display: block; width: 100%; box-sizing: border-box; padding: 7px 9px; margin-top: 3px; font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 18px; }
</style>
</head>
<body>
<header><a href="#">Northwind</a><a href="#">Pricing</a><a href="#">Sign in</a></header>
<main>
  <h1>Create your account</h1>
  <form method="post" action="/form">
    <fieldset>
      <legend>You</legend>
      <div class="row">
        <label>First name <input type="text" name="firstName" autocomplete="off"></label>
        <label>Last name <input type="text" name="lastName" autocomplete="off"></label>
      </div>
      <label>Email <input type="email" name="email" autocomplete="off"></label>
      <label>Phone <input type="tel" name="phone" autocomplete="off"></label>
    </fieldset>
    <fieldset>
      <legend>Work</legend>
      <div class="row">
        <label>Company <input type="text" name="company" autocomplete="off"></label>
        <label>Job title <input type="text" name="jobTitle" autocomplete="off"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Address</legend>
      <label>Street address <input type="text" name="street" autocomplete="off"></label>
      <div class="row">
        <label>City <input type="text" name="city" autocomplete="off"></label>
        <label>Postal code <input type="text" name="postalCode" autocomplete="off"></label>
      </div>
      <label>Country <input type="text" name="country" autocomplete="off"></label>
    </fieldset>
    <label class="check"><input type="checkbox" name="news"> Send me product news</label>
    <label class="check"><input type="checkbox" name="terms"> I agree to the terms</label>
    <p><button type="submit">Create account</button></p>
  </form>
</main>
</body>
</html>
