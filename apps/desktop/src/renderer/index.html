<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- `img-src` names the loopback preview listener because a Quick Look render of a `.docx` is
         served from it as a PNG (QuickLookView.tsx). That origin is already trusted here for
         `frame-src` and `connect-src`, and an image from it can do strictly less than the frame
         already can — it cannot script, navigate or post. It is Realm's own token-gated listener
         either way. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' data: realm-media: http://127.0.0.1:*; media-src realm-media:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src http://127.0.0.1:*" />
    <title>Realm</title>
    <!-- The boot mark. Inline — style AND geometry — because this exists to cover the gap BEFORE the
         bundle runs, and anything it had to fetch would arrive on the far side of the gap it is for.
         The renderer's CSP allows inline style; it allows no inline script, and this needs none. -->
    <style>
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        pointer-events: none; z-index: 2147483647;
        /* Held back 200ms on purpose: a warm launch paints before that and shows nothing at all,
           which is better than a logo that flashes for a single frame. */
        animation: boot-in 240ms cubic-bezier(.23, 1, .32, 1) 200ms both;
      }
      #boot[data-done] { animation: boot-out 200ms ease-in both; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-out { from { opacity: 1; } to { opacity: 0; } }
      .boot-mark { width: 64px; height: auto; }
      /* The house shimmer's timing (1.4s linear infinite — styles.css `.shimmer-text`), spent as a
         highlight swept across the mark rather than across text. Clipped to the mark's own
         silhouette, so the sweep is never a band crossing an empty window. */
      .boot-shine { animation: boot-sweep 1.4s linear infinite; }
      @keyframes boot-sweep { from { transform: translateX(0); } to { transform: translateX(84px); } }
      /* On a light desktop the mark is silver on near-white and would dissolve. The edge is what
         keeps it readable without repainting the brand in a second colour. */
      @media (prefers-color-scheme: light) {
        .boot-mark { filter: brightness(.86) drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
      }
      /* The sweep is decoration and goes. The mark stays, because it is the content. */
      @media (prefers-reduced-motion: reduce) {
        .boot-shine { display: none; }
        #boot, #boot[data-done] { animation-duration: 1ms; animation-delay: 0ms; }
      }
    </style>
  </head>
