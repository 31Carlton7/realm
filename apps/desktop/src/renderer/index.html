<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- `img-src` names the loopback preview listener because a Quick Look render of a `.docx` is
         served from it as a PNG (QuickLookView.tsx). That origin is already trusted here for
         `frame-src` and `connect-src`, and an image from it can do strictly less than the frame
         already can — it cannot script, navigate or post. It is Realm's own token-gated listener
         either way.
         `frame-src` also names the views MCP servers draw (MCP Apps), each served by Realm's views
         listener on a host of its own under `.mcp-view.localhost`. It is the frame and nothing else:
         this page never fetches from, scripts or images from those hosts, and a view that tries to
         take its frame to any address outside these two is refused here before main is asked. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' data: realm-media: http://127.0.0.1:*; media-src realm-media:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src http://127.0.0.1:* http://*.mcp-view.localhost:*" />
    <title>Realm</title>
    <!-- The boot mark. Inline — style AND geometry — because this exists to cover the gap BEFORE the
         bundle runs, and anything it had to fetch would arrive on the far side of the gap it is for.
         The renderer's CSP allows inline style; it allows no inline script, and this needs none. -->
    <style>
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        pointer-events: none; z-index: 2147483647;
        /* Held back 200ms on purpose: a warm launch paints before that and shows nothing at all,
           which is better than a logo that flashes for a single frame. */
        animation: boot-in 240ms cubic-bezier(.23, 1, .32, 1) 200ms both;
      }
      #boot[data-done] { animation: boot-out 200ms ease-in both; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-out { from { opacity: 1; } to { opacity: 0; } }
      .boot-mark { width: 64px; height: auto; }
      /* The house shimmer's sweep (1.4s linear — styles.css `.shimmer-text`), spent as a
         highlight swept across the mark rather than across text. Clipped to the mark's own
         shape, so the sweep is never a band crossing an empty window. The mark's three blues read on a
         light desktop and a dark one alike, so it needs no second treatment for either. */
      .boot-shine { animation: boot-sweep 1.4s linear infinite; }
      @keyframes boot-sweep { from { transform: translateX(0); } to { transform: translateX(84px); } }
      /* The sweep is decoration and goes. The mark stays, because it is the content. */
      @media (prefers-reduced-motion: reduce) {
        .boot-shine { display: none; }
        #boot, #boot[data-done] { animation-duration: 1ms; animation-delay: 0ms; }
      }
    </style>
  </head>
  <body><div id="boot" aria-hidden="true"><svg class="boot-mark" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="b-shape"><path clip-rule="evenodd" d="M0.5196 24.9A1.8 1.8 0 0 1 0.5196 23.1L9.4804 7.5795A1.8 1.8 0 0 1 11.0392 6.6795L28.9608 6.6795A1.8 1.8 0 0 1 30.5196 7.5795L39.4804 23.1A1.8 1.8 0 0 1 39.4804 24.9L30.5196 40.4205A1.8 1.8 0 0 1 28.9608 41.3205L11.0392 41.3205A1.8 1.8 0 0 1 9.4804 40.4205ZM24.4 20.8823L28.2 14.3005L35.9 27.6373L32.1 34.2191Z"/></clipPath>
        <linearGradient id="b-shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#b-shape)">
        <path fill="#9cc1ff" d="M20 24L0 24L10 6.6795L30 6.6795Z"/>
        <path fill="#4f8cf5" d="M20 24L30 41.3205L10 41.3205L0 24Z"/>
        <path fill="#2457c4" d="M20 24L30 6.6795L40 24L30 41.3205Z"/>
      </g>
      <g clip-path="url(#b-shape)"><rect class="boot-shine" x="-44" y="-4" width="44" height="56" fill="url(#b-shine)"/></g>
    </svg></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
