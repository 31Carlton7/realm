# Packaging (electron-builder). Run via `pnpm dist` / `pnpm dist:dir` at the repo root:
# root build first (packages, server tsup bundle, electron-vite out/), then scripts/stage-pack.mjs
# assembles .pack-stage/ (server deploy w/ node_modules, bundled skills, scrollphase helper, icon),
# then electron-builder packs out/ into the asar and .pack-stage/ into Contents/Resources.
appId: co.charmtechnologies.realm
productName: Realm
directories:
  output: release
files:
  - out/**
# Nothing native lives in the app itself, and there are no production deps to collect (see
# package.json "//dependencies") — never invoke npm/node-gyp during packaging.
npmRebuild: false
nodeGypRebuild: false
asar: true
extraResources:
  # Everything the packaged app needs on real disk (asar cannot serve node-pty's native bits or a
  # spawnable server entry): server/ (dist + prod node_modules), skills/, scrollphase (when built).
  - from: .pack-stage
    to: .
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Signing (Plan 15 W3): no `identity` here — scripts/pack.mjs adds `-c.mac.identity=null` (skip
  # codesign entirely rather than fail hunting for a cert) exactly when the env carries no
  # CSC_LINK/CSC_NAME. With credentials present the build signs with hardened runtime, and
  # scripts/notarize.cjs notarizes+staples when APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
  # are set too (it no-ops loudly otherwise). Human steps: docs/dev/signing.md. Unsigned
  # consequence (README "Install"): first launch on another Mac needs right-click → Open, or
  # `xattr -cr /Applications/Realm.app` if Gatekeeper reports it damaged.
  hardenedRuntime: true
  gatekeeperAssess: false
  # The sentences macOS puts in its own consent dialogs. TCC attributes a `mac` CLI call to the app
  # that owns the process tree — Realm — so these are the strings the user reads when Settings →
  # Permissions raises a prompt, and the reason each one gives has to be true of Realm, not of a
  # generic "this app". For the EventKit/Contacts grants the string is also load-bearing rather than
  # cosmetic: macOS refuses the request outright when the matching key is absent. The Full*
  # variants are macOS 14's split — without them a Calendar grant comes back add-only (`writeOnly`
  # in the Permissions tab: writes land, reads come back empty).
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Realm lets the coding agents you run control apps like Mail, Messages, Notes and Finder on
      your behalf — reading a thread, drafting a reply, filing a note.
    NSCalendarsUsageDescription: >-
      Realm lets the coding agents you run read and add Calendar events on your behalf.
    NSCalendarsFullAccessUsageDescription: >-
      Realm lets the coding agents you run read and add Calendar events on your behalf. Reading
      needs full access; with add-only access they can create events but never see them.
    NSRemindersUsageDescription: >-
      Realm lets the coding agents you run read, add and complete Reminders on your behalf.
    NSRemindersFullAccessUsageDescription: >-
      Realm lets the coding agents you run read, add and complete Reminders on your behalf.
    NSContactsUsageDescription: >-
      Realm lets the coding agents you run look up contacts on your behalf — to address an email or
      a message you asked for.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
afterSign: scripts/notarize.cjs
# The update feed's shape (Plan 15 W1/W2): presence of this block makes electron-builder emit
# latest-mac.yml next to the dmg/zip (what `pnpm release` stages for a GitHub release) and embed
# app-update.yml in the app. It does NOT publish — both dist scripts pin `--publish never`; humans
# publish (see `pnpm release`'s printed next steps). The public repository makes release assets
# readable without credentials; src/main/updater.ts still requires a signed packaged build.
publish:
  provider: github
  owner: 31Carlton7
  repo: realm
